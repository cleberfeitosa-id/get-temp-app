<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Histórico de Alertas - Get Temp</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&amp;family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-highest": "#e0e3e5",
              "primary": "#006399",
              "on-primary-fixed": "#001d32",
              "surface-container": "#eceef0",
              "tertiary-fixed-dim": "#ffb781",
              "on-surface": "#191c1e",
              "on-surface-variant": "#3f484c",
              "outline": "#6f787d",
              "surface-container-lowest": "#ffffff",
              "error-container": "#ffdad6",
              "surface-bright": "#f7f9fb",
              "primary-container": "#8fcaff",
              "on-error": "#ffffff",
              "primary-fixed-dim": "#94ccff",
              "primary-fixed": "#cde5ff",
              "on-tertiary-container": "#7f4000",
              "surface-variant": "#e0e3e5",
              "on-tertiary-fixed-variant": "#703800",
              "on-secondary": "#ffffff",
              "tertiary-fixed": "#ffdcc4",
              "on-secondary-fixed-variant": "#5e4100",
              "background": "#f7f9fb",
              "secondary-container": "#ffb702",
              "secondary-fixed-dim": "#ffba27",
              "on-error-container": "#93000a",
              "on-background": "#191c1e",
              "inverse-on-surface": "#eff1f3",
              "tertiary-container": "#ffb47c",
              "surface": "#f7f9fb",
              "surface-container-low": "#f2f4f6",
              "secondary-fixed": "#ffdea9",
              "surface-tint": "#006399",
              "outline-variant": "#bfc8cd",
              "surface-dim": "#d8dadc",
              "secondary": "#7d5800",
              "on-primary-container": "#005584",
              "inverse-surface": "#2d3133",
              "on-tertiary-fixed": "#301400",
              "surface-container-high": "#e6e8ea",
              "on-primary-fixed-variant": "#004b74",
              "on-tertiary": "#ffffff",
              "on-primary": "#ffffff",
              "inverse-primary": "#94ccff",
              "error": "#ba1a1a",
              "on-secondary-container": "#6b4b00",
              "tertiary": "#934b00",
              "on-secondary-fixed": "#271900"
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Manrope"],
              "label": ["Manrope"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Manrope', sans-serif; }
        .font-headline { font-family: 'Space Grotesk', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen pb-32">
<!-- TopAppBar -->

<main class="px-6 pt-6 max-w-4xl mx-auto">
<!-- Hero Section Header -->
<div class="mb-8">
<h2 class="font-headline text-4xl font-bold tracking-tight text-on-surface mb-2">Alertas</h2>
<p class="text-on-surface-variant font-medium">Monitoramento em tempo real das câmaras frias.</p>
</div>
<!-- Search & Filter Controls -->
<div class="flex flex-col gap-4 mb-8">
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" data-icon="search">search</span>
<input id="search-input" class="w-full bg-surface-container-low border-none rounded-xl py-4 pl-12 pr-4 focus:ring-2 focus:ring-primary text-on-surface placeholder:text-outline-variant" placeholder="Buscar por câmara ou evento..." type="text"/>
</div>
<div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-hide">
<button class="filter-btn px-5 py-2 bg-primary text-on-primary rounded-full font-semibold text-sm whitespace-nowrap" data-filter="all">Tudo</button>
<button class="filter-btn px-5 py-2 bg-surface-container-high text-on-surface-variant rounded-full font-semibold text-sm whitespace-nowrap hover:bg-surface-container-highest transition-colors" data-filter="critical">Críticos</button>
<button class="filter-btn px-5 py-2 bg-surface-container-high text-on-surface-variant rounded-full font-semibold text-sm whitespace-nowrap hover:bg-surface-container-highest transition-colors" data-filter="warning">Avisos</button>
<button class="filter-btn px-5 py-2 bg-surface-container-high text-on-surface-variant rounded-full font-semibold text-sm whitespace-nowrap hover:bg-surface-container-highest transition-colors flex items-center gap-1" data-filter="all">
<span class="material-symbols-outlined text-sm" data-icon="filter_list">filter_list</span>
                    Filtrar
                </button>
</div>
</div>
<!-- Alerts List — populated dynamically by main.ts -->
<div id="alerts-list" class="grid grid-cols-1 gap-4">
  <!-- Loading skeleton -->
  <div class="bg-surface-container-low p-5 rounded-lg animate-pulse h-28"></div>
  <div class="bg-surface-container-low p-5 rounded-lg animate-pulse h-28 opacity-70"></div>
  <div class="bg-surface-container-low p-5 rounded-lg animate-pulse h-28 opacity-50"></div>
</div>
</main>
<!-- BottomNavBar -->

<script type="module" src="/src/main.ts"></script>
</body></html>
