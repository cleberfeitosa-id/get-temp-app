<!DOCTYPE html>

<html class="light" lang="pt-br"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Geração de Relatório - Get Temp</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-tertiary-fixed": "#301400",
              "primary-fixed-dim": "#94ccff",
              "on-tertiary-container": "#7f4000",
              "on-secondary-container": "#6b4b00",
              "surface-container-lowest": "#ffffff",
              "on-primary": "#ffffff",
              "background": "#f7f9fb",
              "secondary-container": "#ffb702",
              "on-primary-container": "#005584",
              "surface-container-low": "#f2f4f6",
              "inverse-surface": "#2d3133",
              "on-primary-fixed": "#001d32",
              "surface-tint": "#006399",
              "surface-variant": "#e0e3e5",
              "surface-dim": "#d8dadc",
              "inverse-on-surface": "#eff1f3",
              "on-secondary": "#ffffff",
              "surface-bright": "#f7f9fb",
              "surface-container-high": "#e6e8ea",
              "tertiary-fixed": "#ffdcc4",
              "error-container": "#ffdad6",
              "inverse-primary": "#94ccff",
              "on-primary-fixed-variant": "#004b74",
              "primary": "#006399",
              "on-tertiary-fixed-variant": "#703800",
              "on-background": "#191c1e",
              "outline": "#6f787d",
              "tertiary-fixed-dim": "#ffb781",
              "tertiary-container": "#ffb47c",
              "on-surface": "#191c1e",
              "tertiary": "#934b00",
              "surface-container": "#eceef0",
              "on-tertiary": "#ffffff",
              "primary-fixed": "#cde5ff",
              "on-secondary-fixed": "#271900",
              "on-surface-variant": "#3f484c",
              "surface": "#f7f9fb",
              "secondary-fixed-dim": "#ffba27",
              "secondary-fixed": "#ffdea9",
              "on-error": "#ffffff",
              "error": "#ba1a1a",
              "outline-variant": "#bfc8cd",
              "surface-container-highest": "#e0e3e5",
              "on-secondary-fixed-variant": "#5e4100",
              "on-error-container": "#93000a",
              "secondary": "#7d5800",
              "primary-container": "#8fcaff"
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Manrope"],
              "label": ["Manrope"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body {
        font-family: 'Manrope', sans-serif;
        background-color: #f7f9fb;
        color: #191c1e;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen pb-32">
<!-- TopAppBar -->

<main class="max-w-7xl mx-auto px-6 pt-8">
<!-- Hero Section / Header -->
<div class="mb-10 flex flex-col items-start gap-1">
<span class="font-headline text-primary font-bold tracking-widest text-xs uppercase">Insights Get Temp</span>
<h2 class="font-headline text-4xl md:text-5xl font-bold tracking-tighter text-on-surface">Gerar Relatório</h2>
</div>
<!-- Main Configuration Grid -->
<div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
<!-- Report Config Form (Bento Style) -->
<div class="lg:col-span-8 grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Report Type Picker -->
<section class="glass-card p-8 rounded-lg border border-outline-variant/15 md:col-span-2 mb-4">
<h3 class="font-headline text-lg font-bold mb-6 flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="category">category</span>
                        Selecione o Tipo de Relatório
                    </h3>
<div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
<button data-type="Resumo Semanal" class="type-btn flex flex-col items-start p-6 rounded-2xl border-2 border-primary bg-primary/5 text-left transition-all shadow-sm">
<span class="material-symbols-outlined mb-4 text-primary text-3xl" data-icon="date_range" style="font-variation-settings: 'FILL' 1;">date_range</span>
<span class="w-full">Resumo Semanal</span>
<span class="w-full">Ciclo completo de medições de temperatura e eventos.</span>
</button>
<button data-type="Auditoria de Qualidade" class="type-btn flex flex-col items-start p-6 rounded-2xl border-2 border-transparent bg-surface-container-low text-left transition-all hover:bg-surface-container-high">
<span class="material-symbols-outlined mb-4 text-outline text-3xl" data-icon="verified_user">verified_user</span>
<span class="w-full">Auditoria de Qualidade</span>
<span class="w-full">Relatório focado em conformidade para cadeia fria.</span>
</button>
<button data-type="Histórico de Alertas" class="type-btn flex flex-col items-start p-6 rounded-2xl border-2 border-transparent bg-surface-container-low text-left transition-all hover:bg-surface-container-high">
<span class="material-symbols-outlined mb-4 text-outline text-3xl" data-icon="warning">warning</span>
<span class="w-full">Histórico de Alertas</span>
<span class="w-full">Linha do tempo de todos os eventos de e desvios.</span>
</button>
</div>
</section>
<!-- Date Range Picker -->
<section class="glass-card p-8 rounded-lg border border-outline-variant/15 mb-4">
<h3 class="font-headline text-lg font-bold mb-6 flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="calendar_month">calendar_month</span>
                        Intervalo de Datas
                    </h3>
<div class="space-y-4">
<div class="relative">
<label class="block text-[10px] font-bold uppercase tracking-widest text-on-surface-variant mb-1 ml-1">Data Inicial</label>
<div class="bg-surface-container-lowest rounded-full px-4 py-3 flex items-center gap-3 border border-outline-variant/20 shadow-sm">
<span class="material-symbols-outlined text-outline text-sm" data-icon="event">event</span>
<input id="date-start" class="bg-transparent border-none focus:ring-0 text-sm font-semibold w-full" type="text" value="12 Out, 2023" readonly/>
</div>
</div>
<div class="relative">
<label class="block text-[10px] font-bold uppercase tracking-widest text-on-surface-variant mb-1 ml-1">Data Final</label>
<div class="bg-surface-container-lowest rounded-full px-4 py-3 flex items-center gap-3 border border-outline-variant/20 shadow-sm">
<span class="material-symbols-outlined text-outline text-sm" data-icon="event">event</span>
<input id="date-end" class="bg-transparent border-none focus:ring-0 text-sm font-semibold w-full" type="text" value="19 Out, 2023" readonly/>
</div>
</div>
</div>
</section>
<!-- Customization Options -->
<section class="glass-card p-8 rounded-lg border border-outline-variant/15 mb-4">
<h3 class="font-headline text-lg font-bold mb-6 flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="tune">tune</span>
                        Customização
                    </h3>
<div class="space-y-5"><label class="flex items-center justify-between cursor-pointer py-1">
<div class="flex flex-col pr-4">
<span class="font-headline text-sm font-bold text-on-surface">Incluir Gráficos</span>
<span class="text-xs text-on-surface-variant leading-normal">Representações visuais de dados</span>
</div>
<input id="chk-graphs" checked="" class="w-10 h-6 rounded-full bg-surface-variant appearance-none checked:bg-primary relative transition-colors cursor-pointer before:content-[''] before:absolute before:w-4 before:h-4 before:bg-white before:rounded-full before:top-1 before:left-1 checked:before:translate-x-4 before:transition-transform shrink-0" type="checkbox"/>
</label>
<label class="flex items-center justify-between cursor-pointer py-1">
<div class="flex flex-col pr-4">
<span class="font-headline text-sm font-bold text-on-surface">Incluir Logs de Alerta</span>
<span class="text-xs text-on-surface-variant leading-normal">Eventos detalhados de desvio de sensor</span>
</div>
<input id="chk-logs" checked="" class="w-10 h-6 rounded-full bg-surface-variant appearance-none checked:bg-primary relative transition-colors cursor-pointer before:content-[''] before:absolute before:w-4 before:h-4 before:bg-white before:rounded-full before:top-1 before:left-1 checked:before:translate-x-4 before:transition-transform shrink-0" type="checkbox"/>
</label>
<div class="pt-4 border-t border-outline-variant/10">
<span class="block text-[10px] font-bold uppercase tracking-widest text-on-surface-variant mb-4">Formato do Arquivo</span>
<div class="flex gap-3">
<button class="flex-1 py-2.5 px-4 rounded-full border-2 border-primary text-primary font-bold text-xs bg-primary/5 hover:bg-primary/10 transition-colors">PDF</button>
<button class="flex-1 py-2.5 px-4 rounded-full border border-outline-variant text-outline font-bold text-xs hover:bg-surface-container-high transition-colors">CSV</button>
<button class="flex-1 py-2.5 px-4 rounded-full border border-outline-variant text-outline font-bold text-xs hover:bg-surface-container-high transition-colors">JSON</button>
</div>
</div></div>
</section>
<!-- Action Section -->
<div class="md:col-span-2 flex justify-end pt-4">
<button class="bg-primary text-white font-headline font-bold px-10 py-5 rounded-full shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all flex items-center gap-3">
<span class="material-symbols-outlined" data-icon="auto_awesome" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
                        Gerar Relatório
                    </button>
</div>
</div>
<!-- Recent Reports Sidebar -->
<div class="lg:col-span-4 space-y-6">
<section class="bg-surface-container-low/50 rounded-lg p-8 border border-outline-variant/10">
<div class="flex justify-between items-end mb-6">
<h3 class="font-headline text-lg font-bold">Relatórios Recentes</h3>
<button class="text-primary text-xs font-bold hover:underline">Ver Todos</button>
</div>
<div id="recent-reports-container" class="space-y-4">
<!-- Dynamic Recent Reports inject via TS -->
</div>
<!-- Atmospheric Tip -->
<div class="mt-8 p-5 rounded-lg bg-gradient-to-br from-primary-container/40 to-white/20 border border-primary-container/20">
<span class="material-symbols-outlined text-primary mb-2 block" data-icon="lightbulb">lightbulb</span>
<p class="text-xs leading-relaxed text-on-primary-container font-medium">
                            Dica: Agendar relatórios recorrentes ajuda a manter a conformidade sem intervenção manual.
                        </p>
</div>
</section>
</div>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->

<script type="module" src="/src/main.ts"></script>
</body></html>
