<!DOCTYPE html>

<html class="light" lang="pt-br"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&amp;family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container": "#eceef0",
              "primary": "#006399",
              "surface-container-highest": "#e0e3e5",
              "on-primary-fixed": "#001d32",
              "tertiary-fixed-dim": "#ffb781",
              "on-surface": "#191c1e",
              "on-surface-variant": "#3f484c",
              "error-container": "#ffdad6",
              "surface-container-lowest": "#ffffff",
              "outline": "#6f787d",
              "primary-fixed": "#cde5ff",
              "primary-fixed-dim": "#94ccff",
              "on-error": "#ffffff",
              "surface-bright": "#f7f9fb",
              "primary-container": "#8fcaff",
              "on-secondary": "#ffffff",
              "on-tertiary-fixed-variant": "#703800",
              "surface-variant": "#e0e3e5",
              "on-tertiary-container": "#7f4000",
              "on-background": "#191c1e",
              "secondary-fixed-dim": "#ffba27",
              "on-error-container": "#93000a",
              "secondary-container": "#ffb702",
              "on-secondary-fixed-variant": "#5e4100",
              "background": "#f7f9fb",
              "tertiary-fixed": "#ffdcc4",
              "inverse-on-surface": "#eff1f3",
              "surface": "#f7f9fb",
              "tertiary-container": "#ffb47c",
              "surface-container-low": "#f2f4f6",
              "secondary-fixed": "#ffdea9",
              "secondary": "#7d5800",
              "on-primary-container": "#005584",
              "surface-dim": "#d8dadc",
              "inverse-surface": "#2d3133",
              "surface-tint": "#006399",
              "outline-variant": "#bfc8cd",
              "on-primary": "#ffffff",
              "on-tertiary": "#ffffff",
              "surface-container-high": "#e6e8ea",
              "on-primary-fixed-variant": "#004b74",
              "on-tertiary-fixed": "#301400",
              "inverse-primary": "#94ccff",
              "on-secondary-container": "#6b4b00",
              "error": "#ba1a1a",
              "on-secondary-fixed": "#271900",
              "tertiary": "#934b00"
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Manrope"],
              "label": ["Manrope"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 100%;
        }
        .sky-gradient {
            background: linear-gradient(180deg, #f7f9fb 0%, #f0f5fa 50%, #e8eef4 100%);
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animate-gradient {
            animation: gradient 3s ease infinite;
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background font-body text-on-background min-h-screen sky-gradient selection:bg-primary-container">
<!-- TopAppBar -->

<main class="pt-6 pb-32 px-6 flex flex-col items-center min-h-screen">
<!-- Main Chamber Status: Câmara 01 -->
<section class="w-full max-w-3xl py-6 flex flex-col items-center relative overflow-hidden">
<div class="relative z-10 w-full flex flex-col items-center text-center">
<div class="inline-flex items-center px-4 py-1.5 rounded-full bg-primary-fixed text-on-primary-fixed-variant text-xs font-bold tracking-wide mb-4">
<span class="material-symbols-outlined text-[14px] mr-1" style="font-variation-settings: 'FILL' 1;">sensors</span>
                    STATUS DAS CÂMARAS ATIVAS
                </div>
<div class="flex items-end justify-center w-full gap-8">
<div class="text-center">
<p id="cam_name" class="text-sm font-label text-on-surface-variant uppercase tracking-widest mb-1">Câmara 01</p>
<div class="relative">
<h2 id="cam_temp" class="font-headline leading-none font-bold tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-primary via-primary-container to-primary bg-[length:200%_auto] animate-gradient text-[8rem] md:text-[9rem] drop-shadow-lg">-18<span class="text-primary-container text-[5rem] align-top -mt-8">°C</span></h2>
<div class="absolute -bottom-2 left-0 w-full h-1 bg-gradient-to-r from-primary via-secondary-container to-primary rounded-full"></div>
</div>
</div>
<div class="text-center mb-4">
<div id="status_badge" class="inline-flex items-center px-3 py-1 rounded-full bg-green-100 text-green-700 text-[10px] font-bold uppercase tracking-wider mb-2">
<span class="w-1.5 h-1.5 rounded-full bg-green-500 mr-1.5 animate-pulse"></span>
<span id="status_text">Estável</span>
</div>
<p id="last_update" class="text-[10px] text-on-surface-variant">Última atualização: --:--</p>
</div>
</div>
<div class="mt-8 flex flex-col items-center gap-4">
<div class="flex items-center gap-4">
<div class="p-3 bg-white rounded-full shadow-sm ring-1 ring-black/5">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<p id="system_status" class="text-2xl font-headline font-medium text-on-surface-variant">Sistema Normal</p>
</div>
</div>
</div>
<!-- Decorative Glow Background Element -->
<div class="absolute -right-20 -top-10 w-64 h-64 bg-primary-container/20 blur-[80px] rounded-full"></div>
</section>
<!-- Bento Details Section & Sub-Chambers -->
<section class="w-full max-w-4xl mt-6 flex flex-col items-center">
<div id="dynamic-chambers-grid" class="flex flex-col items-center gap-4 w-full"></div>
</section>

<!-- Debug Panel & Live MQTT Chat -->
<section class="w-full max-w-3xl mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
<!-- Debug: Connected Devices Count -->
<div class="bg-surface-container-low rounded-lg p-4 border border-outline-variant/10">
<div class="flex items-center justify-between mb-3">
<h4 class="font-headline text-sm font-bold text-on-surface">Debug - Dispositivos</h4>
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">devices</span>
</div>
<div class="flex items-baseline gap-2">
<span id="connected-count" class="text-4xl font-headline font-bold text-primary">0</span>
<span class="text-xs text-on-surface-variant uppercase tracking-wider">conectados</span>
</div>
<div class="mt-3 h-1 bg-surface-container-highest rounded-full overflow-hidden">
<div id="connected-bar" class="h-full bg-primary transition-all duration-300" style="width: 0%"></div>
</div>
</div>

<!-- Live MQTT Payload Chat -->
<div class="bg-surface-container-low rounded-lg p-4 border border-outline-variant/10 flex flex-col h-[180px]">
<div class="flex items-center justify-between mb-2">
<h4 class="font-headline text-sm font-bold text-on-surface">Live MQTT Payload</h4>
<span class="text-[10px] text-on-surface-variant uppercase tracking-wider bg-surface-container px-2 py-0.5 rounded-full" id="mqtt-count">0 msgs</span>
</div>
<div id="mqtt-chat" class="flex-1 overflow-y-auto space-y-2 pr-2 text-[10px] font-mono"></div>
</div>
</section>
</main>
<!-- BottomNavBar -->



<script type="module" src="/src/main.ts"></script>
</body></html>
