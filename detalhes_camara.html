<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&amp;family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-highest": "#e0e3e5",
              "primary": "#006399",
              "on-primary-fixed": "#001d32",
              "surface-container": "#eceef0",
              "tertiary-fixed-dim": "#ffb781",
              "on-surface": "#191c1e",
              "on-surface-variant": "#3f484c",
              "outline": "#6f787d",
              "surface-container-lowest": "#ffffff",
              "error-container": "#ffdad6",
              "surface-bright": "#f7f9fb",
              "primary-container": "#8fcaff",
              "on-error": "#ffffff",
              "primary-fixed-dim": "#94ccff",
              "primary-fixed": "#cde5ff",
              "on-tertiary-container": "#7f4000",
              "surface-variant": "#e0e3e5",
              "on-tertiary-fixed-variant": "#703800",
              "on-secondary": "#ffffff",
              "tertiary-fixed": "#ffdcc4",
              "on-secondary-fixed-variant": "#5e4100",
              "background": "#f7f9fb",
              "secondary-container": "#ffb702",
              "secondary-fixed-dim": "#ffba27",
              "on-error-container": "#93000a",
              "on-background": "#191c1e",
              "inverse-on-surface": "#eff1f3",
              "tertiary-container": "#ffb47c",
              "surface": "#f7f9fb",
              "surface-container-low": "#f2f4f6",
              "secondary-fixed": "#ffdea9",
              "surface-tint": "#006399",
              "outline-variant": "#bfc8cd",
              "surface-dim": "#d8dadc",
              "secondary": "#7d5800",
              "on-primary-container": "#005584",
              "inverse-surface": "#2d3133",
              "on-tertiary-fixed": "#301400",
              "surface-container-high": "#e6e8ea",
              "on-primary-fixed-variant": "#004b74",
              "on-tertiary": "#ffffff",
              "on-primary": "#ffffff",
              "inverse-primary": "#94ccff",
              "error": "#ba1a1a",
              "on-secondary-container": "#6b4b00",
              "tertiary": "#934b00",
              "on-secondary-fixed": "#271900"
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Manrope"],
              "label": ["Manrope"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->

<main class="max-w-screen-md mx-auto px-6 pt-6 pb-32">
<!-- Hero: Temperature Display -->
<section class="relative mb-10">
<div class="flex flex-col items-start gap-1">
<div class="flex items-center gap-2 bg-secondary-fixed text-on-secondary-fixed-variant px-3 py-1 rounded-full">
<span class="material-symbols-outlined text-[14px]" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-[10px] font-bold uppercase tracking-widest">Estável</span>
</div>
<div class="flex items-baseline mt-2">
<h1 class="text-[5.5rem] font-headline font-bold text-primary tracking-tighter leading-none">-18.4</h1>
<span class="text-3xl font-headline font-light text-primary-container">°C</span>
</div>
<p class="text-on-surface-variant font-medium mt-1">Atualizado há 2 minutos</p>
</div>
<!-- Stability Trend Indicator (Atmospheric element) -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary-container/20 rounded-full blur-3xl -z-10"></div>
</section>
<!-- Stability Graph Section -->
<section class="mb-8">
<div class="flex justify-between items-center mb-4">
<h2 class="text-sm font-bold uppercase tracking-widest text-outline">Estabilidade (Última 1h)</h2>
<span class="text-[12px] font-semibold text-primary">Live</span>
</div>
<div class="w-full h-40 bg-surface-container-low rounded-lg p-4 flex flex-col justify-end gap-2 overflow-hidden relative">
<!-- Y-Axis Labels -->
<div id="details-y-axis" class="absolute left-1 top-2 bottom-8 w-8 flex flex-col justify-between text-[9px] font-bold text-slate-500 pointer-events-none z-10">
<span>--°</span>
<span>--°</span>
<span>--°</span>
</div>
<!-- Abstract Graph Line -->
<div id="details-chart-container" class="absolute inset-0 left-8 right-2 top-2 bottom-8">
<svg id="details-chart-svg" class="w-full h-full" viewBox="0 0 400 100" preserveAspectRatio="none">
<path id="details-chart-line" d="M0 80 Q 20 75, 40 82 T 80 78 T 120 85 T 160 77 T 200 83 T 240 76 T 280 81 T 320 79 T 360 84 T 400 80" fill="none" stroke="#64748b" stroke-linecap="round" stroke-width="2"></path>
<path id="details-chart-area" d="M0 80 Q 20 75, 40 82 T 80 78 T 120 85 T 160 77 T 200 83 T 240 76 T 280 81 T 320 79 T 360 84 T 400 80 V 100 H 0 Z" fill="url(#graphGradient)" opacity="0.15"></path>
<!-- Peak Indicator (Maximum) -->
<g id="details-peak-indicator" class="opacity-0">
<circle r="6" fill="#f59e0b" opacity="0.3"></circle>
<circle r="3" fill="#f59e0b"></circle>
</g>
<!-- Valley Indicator (Minimum) -->
<g id="details-valley-indicator" class="opacity-0">
<circle r="6" fill="#06b6d4" opacity="0.3"></circle>
<circle r="3" fill="#06b6d4"></circle>
</g>
<defs>
<lineargradient id="graphGradient" x1="0" x2="0" y1="0" y2="1">
<stop offset="0%" stop-color="#64748b"></stop>
<stop offset="100%" stop-color="transparent"></stop>
</lineargradient>
</defs>
</svg>
</div>
<!-- Time Markers -->
<div id="details-x-axis" class="flex justify-between w-full text-[9px] font-bold text-slate-500 uppercase tracking-tighter z-10 pl-8 pr-2">
<!-- Injetado dinamicamente -->
</div>
</div>
</section>
<!-- Alerts / Recent Logs Section -->
<section>
<h2 class="text-sm font-bold uppercase tracking-widest text-outline mb-4 px-1">Alertas Recentes</h2>
<div id="chamber-alerts" class="space-y-3">
<!-- Populated by JS -->
<p class="text-center text-on-surface-variant py-4">Carregando alertas...</p>
</div>
</section>
</main>
<!-- BottomNavBar -->

<!-- Decorative Bottom Gradient for Depth -->
<div class="fixed bottom-0 left-0 w-full h-24 bg-gradient-to-t from-background to-transparent pointer-events-none z-40"></div>
<script type="module" src="/src/main.ts"></script>
</body></html>
