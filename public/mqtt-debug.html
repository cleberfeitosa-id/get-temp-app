<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MQTT Debug</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: 'Courier New', monospace; 
      background: #1a1a2e; 
      color: #eee; 
      padding: 20px;
      min-height: 100vh;
      margin: 0;
    }
    h1 { color: #fff; text-align: center; margin-bottom: 20px; }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    .chat-box {
      background: #16213e;
      border-radius: 15px;
      border: 2px solid #0f3460;
      height: 70vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .chat-header {
      background: #0f3460;
      padding: 15px 20px;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .status-indicator {
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }
    .status-disconnected { background: #e94560; color: #fff; }
    .status-connecting { background: #f39c12; color: #000; }
    .status-connected { background: #27ae60; color: #fff; }
    
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .message {
      padding: 12px 15px;
      border-radius: 10px;
      max-width: 85%;
      animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .message-system {
      background: #0f3460;
      color: #4fc3f7;
      align-self: center;
      text-align: center;
      font-size: 13px;
    }
    
    .message-success {
      background: #1e3a5f;
      color: #4caf50;
      align-self: center;
      text-align: center;
      font-size: 13px;
    }
    
    .message-error {
      background: #3d1e1e;
      color: #e94560;
      align-self: center;
      text-align: center;
      font-size: 13px;
    }
    
    .message-received {
      background: #0d2818;
      border-left: 4px solid #4caf50;
      align-self: flex-start;
    }
    
    .message-received .msg-topic {
      color: #4fc3f7;
      font-weight: bold;
      font-size: 12px;
      margin-bottom: 5px;
    }
    
    .message-received .msg-payload {
      color: #fff;
      white-space: pre-wrap;
      font-size: 13px;
    }
    
    .message-received .msg-time {
      color: #666;
      font-size: 11px;
      margin-top: 5px;
    }
    
    .chat-input {
      background: #0f3460;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .connection-info {
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📡 MQTT Debug - gettemp</h1>
    
    <div class="chat-box">
      <div class="chat-header">
        <span>🔌 Broker: r0112411.ala.us-east-1.emqxsl.com</span>
        <span id="status" class="status-indicator status-disconnected">Aguardando...</span>
      </div>
      
      <div id="messages" class="chat-messages">
        <div class="message message-system">Inicializando conexão MQTT...</div>
      </div>
      
      <div class="chat-input">
        <span class="connection-info">Tópico: gettemp/#</span>
        <span id="msg-count">Mensagens: 0</span>
      </div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const messagesEl = document.getElementById('messages');
    const msgCountEl = document.getElementById('msg-count');

    let msgCount = 0;

    function addMessage(text, type = 'system') {
      const div = document.createElement('div');
      div.className = `message message-${type}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addReceivedMessage(topic, payload) {
      msgCount++;
      msgCountEl.textContent = `Mensagens: ${msgCount}`;
      
      const div = document.createElement('div');
      div.className = 'message message-received';
      const time = new Date().toLocaleTimeString();
      
      let formattedPayload = payload;
      try {
        const obj = JSON.parse(payload);
        formattedPayload = JSON.stringify(obj, null, 2);
      } catch (e) {}
      
      div.innerHTML = `
        <div class="msg-topic">📬 ${topic}</div>
        <div class="msg-payload">${formattedPayload}</div>
        <div class="msg-time">${time}</div>
      `;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setStatus(text, type) {
      statusEl.textContent = text;
      statusEl.className = `status-indicator status-${type}`;
    }

    // Config
    const BROKER = 'wss://r0112411.ala.us-east-1.emqxsl.com:8084/mqtt';
    const USERNAME = 'gettemp';
    const PASSWORD = 'gettemp123';
    const TOPIC = 'gettemp/#';

    addMessage('Configurando cliente MQTT...', 'system');
    addMessage(`Broker: ${BROKER}`, 'system');
    addMessage(`Tópico: ${TOPIC}`, 'system');
    setStatus('Conectando...', 'connecting');

    const client = mqtt.connect(BROKER, {
      username: USERNAME,
      password: PASSWORD,
      clean: true,
      connectTimeout: 10000,
      rejectUnauthorized: false,
    });

    client.on('connect', () => {
      setStatus('Conectado!', 'connected');
      addMessage('✓ Conectado ao broker MQTT', 'success');
      addMessage('Assinando tópico...', 'system');
      
      client.subscribe(TOPIC, { qos: 0 }, (err, granted) => {
        if (err) {
          addMessage('✗ Erro ao assinar: ' + err.message, 'error');
          setStatus('Erro!', 'disconnected');
        } else {
          addMessage(`✓ Inscrito em: ${TOPIC}`, 'success');
          setStatus('Ouvindo...', 'connected');
        }
      });
    });

    client.on('error', (err) => {
      addMessage('✗ ERRO: ' + err.message, 'error');
      setStatus('Erro!', 'disconnected');
    });

    client.on('message', (topic, payload) => {
      addReceivedMessage(topic, payload.toString());
    });

    client.on('offline', () => {
      addMessage('⚠ Conexão perdida', 'error');
      setStatus('Offline', 'disconnected');
    });

    client.on('reconnect', () => {
      addMessage('⟳ Reconectando...', 'system');
      setStatus('Reconectando...', 'connecting');
    });

    client.on('disconnect', () => {
      addMessage('⚠ Desconectado', 'error');
      setStatus('Desconectado', 'disconnected');
    });

    client.on('connack', (packet) => {
      addMessage('CONNACK recebido', 'system');
    });

    client.on('suback', (packet) => {
      addMessage('SUBACK recebido - tópico confirmado', 'success');
    });

    addMessage('Cliente criado, conectando...', 'system');
  </script>
</body>
</html>
